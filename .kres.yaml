---
kind: auto.CI
spec:
  compileGHWorkflowsOnly: true
---
kind: common.Repository
spec:
  licenseChecks:
    - skipPaths:
        - .git/
        - testdata/
      includeSuffixes:
        - .go
      excludeSuffixes:
        - .pb.go
        - _string.go
        - _enumer.go
        - _string_linux.go
        - zz_generated.deepcopy.go
      header: |
        // This Source Code Form is subject to the terms of the Mozilla Public
        // License, v. 2.0. If a copy of the MPL was not distributed with this
        // file, You can obtain one at http://mozilla.org/MPL/2.0/.
---
kind: common.SOPS
spec:
  enabled: true
  config: |-
    creation_rules:
      - age: age1xrpa9ujxxcj2u2gzfrzv8mxak4rts94a6y60ypurv6rs5cpr4e4sg95f0k
        # order: Andrey, Noel, Artem, Utku, Tim, Andy
        pgp: >-
          15D5721F5F5BAF121495363EFE042E3D4085A811,
          CC51116A94490FA6FB3C18EB2401FCAE863A06CA,
          4919F560F0D35F80CF382D76E084A2DF1143C14D,
          11177A43C6E3752E682AC690DBD13117B0A14E93,
          5D7964FF2DB426ACB3C3505AA2A702DD5B689F45,
          E77ED9F8451E10BD242D07415444881046F92733
---
kind: common.GHWorkflow
spec:
  jobs:
    - name: default
      sops: true
      buildxOptions:
        enabled: false
      runnerGroup: generic
      conditions:
        - on-pull-request
      steps:
        - name: Set up Docker Buildx
          nonMakeStep: true
          command: |
            # Remote BuildKit does not accept the runner's daemon config. Keep
            # Buildx state isolated per workflow so the remote driver receives
            # no unsupported config file and concurrent jobs cannot share a
            # builder selection.
            export BUILDX_CONFIG="$RUNNER_TEMP/buildx"
            mkdir -p "$BUILDX_CONFIG"
            echo "BUILDX_CONFIG=$BUILDX_CONFIG" >> "$GITHUB_ENV"
            docker buildx create \
              --name "builder-${GITHUB_RUN_ID}" \
              --driver remote \
              --use \
              tcp://buildkit-amd64.ci.svc.cluster.local:1234
        - name: Set up SOPS and yq
          nonMakeStep: true
          command: |
            set -euo pipefail

            if [ "${RUNNER_OS:-}" != "Linux" ]; then
              echo "Kres requires a Linux self-hosted runner for SOPS and yq (RUNNER_OS=${RUNNER_OS:-unset})" >&2
              exit 1
            fi

            case "${RUNNER_ARCH:-}" in
              X64)
                sops_arch=amd64
                yq_arch=amd64
                sops_sha256=e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
                yq_sha256=fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
                ;;
              ARM64)
                sops_arch=arm64
                yq_arch=arm64
                sops_sha256=53b0abacd38ef1b12a66d6c100956691b9cefce018d91f81e73ddf7438b94d77
                yq_sha256=578648e463a11c1b6db6010cbf41eafed6bee79466fcffa1bb446672cf7945ea
                ;;
              *)
                echo "Kres supports only Linux X64 and ARM64 self-hosted runners (RUNNER_ARCH=${RUNNER_ARCH:-unset})" >&2
                exit 1
                ;;
            esac

            for command_name in curl sha256sum chmod mkdir mv; do
              if ! command -v "$command_name" >/dev/null 2>&1; then
                echo "Kres requires $command_name to install verified SOPS and yq tools" >&2
                exit 1
              fi
            done

            tool_dir="${RUNNER_TEMP:?RUNNER_TEMP must be set}/kres-tools"
            mkdir -p "$tool_dir"

            download_and_verify() {
              local url="$1"
              local destination="$2"
              local expected_sha256="$3"
              local temporary="${destination}.download"

              curl --fail --location --retry 3 --retry-delay 1 --silent --show-error \
                "$url" -o "$temporary"
              printf '%s  %s\n' "$expected_sha256" "$temporary" | sha256sum --check --status -
              mv "$temporary" "$destination"
              chmod 0755 "$destination"
            }

            download_and_verify \
              "https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.${sops_arch}" \
              "$tool_dir/sops" \
              "$sops_sha256"
            download_and_verify \
              "https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_${yq_arch}" \
              "$tool_dir/yq" \
              "$yq_sha256"

            printf '%s\n' "$tool_dir" >> "${GITHUB_PATH:?GITHUB_PATH must be set}"
        - name: all
          environment:
            PLATFORM: linux/amd64,linux/arm64
            REGISTRY: registry.dev.siderolabs.io
            PUSH: true
        - name: check-dirty
        - name: unit-tests
        - name: integration-test
          environment:
            REGISTRY: registry.dev.siderolabs.io
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: push
      buildxOptions:
        enabled: false
      runnerGroup: generic
      conditions:
        - except-pull-request
        - not-on-tag
      steps:
        - name: Set up Docker Buildx
          nonMakeStep: true
          command: |
            # Remote BuildKit does not accept the runner's daemon config. Keep
            # Buildx state isolated per workflow so the remote driver receives
            # no unsupported config file and concurrent jobs cannot share a
            # builder selection.
            export BUILDX_CONFIG="$RUNNER_TEMP/buildx"
            mkdir -p "$BUILDX_CONFIG"
            echo "BUILDX_CONFIG=$BUILDX_CONFIG" >> "$GITHUB_ENV"
            docker buildx create \
              --name "builder-${GITHUB_RUN_ID}" \
              --driver remote \
              --use \
              tcp://buildkit-amd64.ci.svc.cluster.local:1234
        - name: login-to-registry
          registryLoginStep:
            registry: ghcr.io
        - name: push
          command: all
          environment:
            PLATFORM: linux/amd64,linux/arm64
            PUSH: true
    - name: tag
      sops: true
      buildxOptions:
        enabled: false
      runnerGroup: generic
      conditions:
        - only-on-tag
      steps:
        - name: Set up Docker Buildx
          nonMakeStep: true
          command: |
            # Remote BuildKit does not accept the runner's daemon config. Keep
            # Buildx state isolated per workflow so the remote driver receives
            # no unsupported config file and concurrent jobs cannot share a
            # builder selection.
            export BUILDX_CONFIG="$RUNNER_TEMP/buildx"
            mkdir -p "$BUILDX_CONFIG"
            echo "BUILDX_CONFIG=$BUILDX_CONFIG" >> "$GITHUB_ENV"
            docker buildx create \
              --name "builder-${GITHUB_RUN_ID}" \
              --driver remote \
              --use \
              tcp://buildkit-amd64.ci.svc.cluster.local:1234
        - name: Set up SOPS and yq
          nonMakeStep: true
          command: |
            set -euo pipefail

            if [ "${RUNNER_OS:-}" != "Linux" ]; then
              echo "Kres requires a Linux self-hosted runner for SOPS and yq (RUNNER_OS=${RUNNER_OS:-unset})" >&2
              exit 1
            fi

            case "${RUNNER_ARCH:-}" in
              X64)
                sops_arch=amd64
                yq_arch=amd64
                sops_sha256=e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
                yq_sha256=fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
                ;;
              ARM64)
                sops_arch=arm64
                yq_arch=arm64
                sops_sha256=53b0abacd38ef1b12a66d6c100956691b9cefce018d91f81e73ddf7438b94d77
                yq_sha256=578648e463a11c1b6db6010cbf41eafed6bee79466fcffa1bb446672cf7945ea
                ;;
              *)
                echo "Kres supports only Linux X64 and ARM64 self-hosted runners (RUNNER_ARCH=${RUNNER_ARCH:-unset})" >&2
                exit 1
                ;;
            esac

            for command_name in curl sha256sum chmod mkdir mv; do
              if ! command -v "$command_name" >/dev/null 2>&1; then
                echo "Kres requires $command_name to install verified SOPS and yq tools" >&2
                exit 1
              fi
            done

            tool_dir="${RUNNER_TEMP:?RUNNER_TEMP must be set}/kres-tools"
            mkdir -p "$tool_dir"

            download_and_verify() {
              local url="$1"
              local destination="$2"
              local expected_sha256="$3"
              local temporary="${destination}.download"

              curl --fail --location --retry 3 --retry-delay 1 --silent --show-error \
                "$url" -o "$temporary"
              printf '%s  %s\n' "$expected_sha256" "$temporary" | sha256sum --check --status -
              mv "$temporary" "$destination"
              chmod 0755 "$destination"
            }

            download_and_verify \
              "https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.${sops_arch}" \
              "$tool_dir/sops" \
              "$sops_sha256"
            download_and_verify \
              "https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_${yq_arch}" \
              "$tool_dir/yq" \
              "$yq_sha256"

            printf '%s\n' "$tool_dir" >> "${GITHUB_PATH:?GITHUB_PATH must be set}"
        - name: release
        - name: login-to-registry
          registryLoginStep:
            registry: ghcr.io
        - name: push
          command: all
          environment:
            PLATFORM: linux/amd64,linux/arm64
            PUSH: true
        - name: release
          releaseStep:
            baseDirectory: _out
            artifacts:
              - control-plane-talos/*/*
            generateChecksums: true
            releaseNotes: RELEASE_NOTES.md
